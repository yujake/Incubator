[pytest]
# 把 rootdir 钉在 tests/：这样 .pytest_cache / __pycache__ 都只落在本目录，
# 不会污染 test/test1/ 下的演示数据（data/、demo/run/ 必须保持干净）。
testpaths = .

# 需要联网的用例默认排除。
#
# 理由：日常跑的套件必须离线、确定性、可重复 —— 否则一次上游限流就会把 CI 搞红，
# 久而久之没人再看红灯。但缺陷 #6（Crossref select=abst 全 400）与 #7（precise 恒 0）
# 恰恰只有真实 HTTP 往返才能发现，所以它们必须留在套件里（不能只写在文档里），
# 只是默认不跑。
#
#   python -m pytest ..\tests -q              # 离线套件（默认）
#   python -m pytest ..\tests -q -m network   # 额外的联网套件
addopts = -m "not network"

markers =
    network: 需要真实网络访问；默认为排除状态，用 -m network 显式运行
